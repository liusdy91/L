<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yusra &amp; Huda Quiz</title>
<meta name="description" content="A Madinah trivia game for kids, hosted by Yusra and Huda.">
<meta name="theme-color" content="#7f9a62">
<style>
:root{
  --sky1:#f6ecd4; --sky2:#ead6aa; --sand:#d9bf8c; --sand-dark:#b99a62;
  --hill-far:#b8b98c; --hill-mid:#97a874; --hill-near:#6f8f55;
  --green:#3f7d5c; --green-dark:#2c5c42; --green-soft:#e3eed8;
  --ink:#3b3324; --ink-soft:#6b5d44; --card:#fffaf0; --line:#e5d6b4;
  --good:#3f8f5a; --bad:#c0564a; --gold:#e1a93b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{color-scheme:light}
body{
  background:var(--sky1); color:var(--ink);
  font-family:"Nunito","Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- scene (background) ---------- */
#scene{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.screen{width:100%;max-width:720px;display:none;flex-direction:column;align-items:center;gap:14px}
.screen.on{display:flex;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- title ---------- */
.title{text-align:center;margin-top:6px}
.title small{display:block;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-dark);font-size:.8rem}
.title h1{margin:4px 0 0;font-size:clamp(1.9rem,7vw,3.1rem);line-height:1.05;color:var(--green-dark);
  text-shadow:0 2px 0 #fff8e6,0 4px 10px rgba(80,60,20,.18)}
.title h1 span{color:var(--gold)}
.title p{margin:8px 0 0;color:var(--ink-soft);font-weight:700}

/* ---------- girls ---------- */
.girls{display:flex;justify-content:center;gap:clamp(10px,5vw,48px);align-items:flex-end}
.girl{display:flex;flex-direction:column;align-items:center;transition:transform .3s ease,filter .3s}
.girl svg{width:clamp(96px,24vw,150px);height:auto;overflow:visible;filter:drop-shadow(0 6px 6px rgba(70,50,20,.18))}
.girls.small .girl svg{width:clamp(64px,15vw,96px)}
.tag{margin-top:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;
  font-weight:900;color:var(--green-dark);display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--line)}
.tag b{background:var(--green);color:#fff;border-radius:999px;min-width:28px;padding:1px 8px;text-align:center}
.girl.dim{filter:saturate(.55) opacity(.7);transform:scale(.92)}
.girl.turn .tag{border-color:var(--gold);box-shadow:0 3px 0 var(--gold),0 0 0 4px rgba(225,169,59,.25)}
.girl.turn svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.girl .arm{transition:transform .35s ease}
.girl.cheer .arm-l{transform:rotate(120deg)}
.girl.cheer .arm-r{transform:rotate(-120deg)}
.girl.cheer svg{animation:jump .5s ease 2}
@keyframes jump{40%{transform:translateY(-18px)}}
.girl.sad svg{animation:shake .45s ease}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* ---------- cards & buttons ---------- */
.card{width:100%;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;
  box-shadow:0 6px 0 var(--line),0 14px 30px rgba(80,60,20,.14)}
.card h2{margin:0 0 10px;font-size:1.05rem;color:var(--green-dark)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;font-weight:800;text-align:center;
  box-shadow:0 3px 0 var(--line);transition:transform .1s}
.pill[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.pill span{display:block;font-weight:600;font-size:.85rem;color:var(--ink-soft)}
.big{background:var(--green);color:#fff;font-weight:900;font-size:1.25rem;border-radius:999px;padding:14px 40px;
  box-shadow:0 5px 0 var(--green-dark);transition:transform .1s}
.big:active,.pill:active,.ans:active{transform:translateY(3px)}
.big.alt{background:var(--card);color:var(--green-dark);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- play ---------- */
.bar{width:100%;display:flex;align-items:center;gap:10px}
.prog{flex:1;height:14px;background:#fff8e6;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hill-mid),var(--green));transition:width .4s}
.count{font-weight:900;color:var(--green-dark);white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);
  font-size:1.2rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.who{font-weight:900;color:var(--ink-soft);text-align:center}
.who b{color:var(--green-dark)}
.q{font-size:clamp(1.25rem,4.6vw,1.7rem);font-weight:900;line-height:1.25;margin:0 0 14px;text-align:center}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:12px 14px;font-weight:800;font-size:clamp(1rem,3.8vw,1.15rem);box-shadow:0 4px 0 var(--line);
  transition:transform .1s,background .2s,border-color .2s}
.ans .let{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green-dark);font-weight:900}
.ans.right{background:#e2f3e4;border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.ans.right .let{background:var(--good);color:#fff}
.ans.wrong{background:#f9e3df;border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.ans.wrong .let{background:var(--bad);color:#fff}
.ans:disabled{cursor:default}
.ans.fade{opacity:.55}
.fact{display:none;margin-top:14px;border-radius:16px;padding:14px;background:var(--green-soft);border:2px dashed var(--hill-mid)}
.fact.on{display:block;animation:pop .3s ease}
.fact .res{font-weight:900;font-size:1.15rem;margin-bottom:4px}
.fact .res.good{color:var(--good)} .fact .res.bad{color:var(--bad)}
.fact p{margin:0 0 6px;line-height:1.45}
.fact .src{font-size:.85rem;color:var(--ink-soft);font-style:italic;margin:0}
.next{margin-top:14px;display:none;justify-content:center}
.next.on{display:flex}

/* ---------- end ---------- */
.result{text-align:center}
.result h2{font-size:clamp(1.6rem,6vw,2.3rem);margin:0;color:var(--green-dark)}
.result p{font-weight:800;color:var(--ink-soft);margin:6px 0 0}
.stars{font-size:2rem;letter-spacing:4px}
.review{width:100%}
.review li{margin:0 0 10px;line-height:1.4}
.review li b{color:var(--green-dark)}
.review ul{padding-left:20px;margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:420px){
  .choices{grid-template-columns:1fr}
  .card{padding:14px;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Girl drawing (faceless, modest, green garments). Colours come from CSS variables. -->

      <rect x="44" y="172" width="10" height="16" fill="#f3e6cf"/><rect x="66" y="172" width="10" height="16" fill="#f3e6cf"/>

<div id="confetti"></div>

<main class="app">

  <!-- ================= Start ================= -->
  <section class="screen on" id="start">
    <div class="title">
      <small>☪ Trivia time</small>
      <h1>Yusra <span>&amp;</span> Huda's<br>Madinah Trivia</h1>
      <p>How much do you know about the city of the Prophet ﷺ?</p>
    </div>

    <div class="girls" id="startGirls"></div>

    <div class="card">
      <h2>How do you want to play?</h2>
      <div class="choices" id="modeChoices">
        <button class="pill" data-mode="vs" aria-pressed="true">⚔️ Yusra vs Huda<span>Take turns, collect stars</span></button>
        <button class="pill" data-mode="team" aria-pressed="false">🤝 Together<span>Answer as one team</span></button>
      </div>
      <h2 style="margin-top:16px">How many questions?</h2>
      <div class="choices" id="lenChoices">
        <button class="pill" data-len="10" aria-pressed="true">⭐ Quick round<span>10 questions</span></button>
        <button class="pill" data-len="25" aria-pressed="false">🌟 All of them<span>25 questions</span></button>
      </div>
    </div>
    <button class="big" id="go">Bismillah, let's play!</button>
  </section>

  <!-- ================= Play ================= -->
  <section class="screen" id="play">
    <div class="bar">
      <button class="iconbtn" id="home" aria-label="Back to start">🏠</button>
      <div class="prog" aria-hidden="true"><i id="progFill"></i></div>
      <span class="count" id="count">1 / 10</span>
      <button class="iconbtn" id="speak" aria-label="Read the question out loud">🔊</button>
    </div>

    <div class="girls small" id="playGirls"></div>
    <div class="who" id="who"></div>

    <div class="card">
      <p class="q" id="q"></p>
      <div class="answers" id="answers"></div>
      <div class="fact" id="fact" aria-live="polite">
        <div class="res" id="res"></div>
        <p id="factText"></p>
        <p class="src" id="src"></p>
      </div>
      <div class="next" id="nextRow"><button class="big" id="next">Next ➜</button></div>
    </div>
  </section>

  <!-- ================= End ================= -->
  <section class="screen" id="end">
    <div class="result">
      <div class="stars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
    </div>
    <div class="girls" id="endGirls"></div>
    <div class="card review" id="reviewCard">
      <h2>Let's remember these 💡</h2>
      <ul id="review"></ul>
    </div>
    <div class="row">
      <button class="big" id="again">Play again</button>
      <button class="big alt" id="toStart">Change game</button>
    </div>
  </section>
</main>

<script>
/* ===================== Questions =====================
   a = correct answer, w = wrong answers, fact = shown after answering, src = where it comes from.
   Answers are shuffled every game. */
const QUESTIONS = [
  { q:"What is the reward for praying in the Prophet's Mosque (Masjid an-Nabawi)?",
    a:"Better than 1,000 prayers in other mosques", w:["The same as 10 prayers","Better than 100 prayers","The reward of one Hajj"],
    fact:"The Prophet ﷺ said one prayer in his mosque is better than a thousand prayers anywhere else, except Al-Masjid Al-Haram in Makkah.",
    src:"Sahih al-Bukhari and Sahih Muslim" },
  { q:"What is the reward for praying in Masjid Quba?",
    a:"The reward of an Umrah", w:["The reward of a Hajj","The reward of fasting one day","10 good deeds"],
    fact:"Whoever makes wudu at home, then goes to Masjid Quba and prays there, gets a reward like an Umrah.",
    src:"Sunan Ibn Majah and Sunan an-Nasa'i (graded sahih)" },
  { q:"Which battles took place in Madinah?",
    a:"Uhud and Al-Khandaq (the Trench)", w:["Hunayn and Ta'if","Tabuk and Khaybar","Mu'tah and Yarmuk"],
    fact:"Uhud was fought at the foot of Mount Uhud, just north of the city. In the Battle of the Trench, the Muslims dug a big ditch around Madinah to protect it.",
    src:"Books of Seerah" },
  { q:"Which 2 battles near Madinah did the Muslims win?",
    a:"Badr and Al-Khandaq (the Trench)", w:["Uhud and Badr","Uhud and Al-Khandaq (the Trench)"],
    fact:"Allah gave the Muslims victory at Badr (southwest of Madinah) and at the Trench. Uhud was a hard day that taught the Muslims to always obey the Prophet ﷺ.",
    src:"Qur'an 3:123 (Badr) and 33:9 (the Trench)" },
  { q:"In which masjid did the Prophet ﷺ pray for rain?",
    a:"Masjid al-Ghamamah", w:["Masjid Quba","Masjid al-Qiblatayn","Masjid al-Jumu'ah"],
    fact:"Ghamamah means \"cloud\". This masjid is close to the Prophet's Mosque, at the place where he ﷺ prayed the Eid prayer and, as the people of Madinah report, the prayer for rain.",
    src:"Books on the history of Madinah" },
  { q:"Where did the Prophet ﷺ pray his first Jumu'ah after the Hijrah from Makkah?",
    a:"Masjid al-Jumu'ah", w:["Masjid an-Nabawi","Masjid al-Ghamamah","Masjid al-Qiblatayn"],
    fact:"On his way from Quba into the city, the Prophet ﷺ prayed the first Jumu'ah with the tribe of Banu Salim ibn 'Awf. A masjid was built there called Masjid al-Jumu'ah.",
    src:"As-Seerah an-Nabawiyyah (Ibn Hisham)" },
  { q:"What was the first masjid built in Madinah?",
    a:"Masjid Quba", w:["Masjid an-Nabawi","Masjid al-Qiblatayn","Masjid al-Ghamamah"],
    fact:"Masjid Quba was the very first masjid built in Islam, when the Prophet ﷺ arrived in Quba after the Hijrah.",
    src:"Books of Seerah; see Qur'an 9:108" },
  { q:"Who built Masjid Quba?",
    a:"The Prophet ﷺ and his companions", w:["Prophet Ibrahim","Umar ibn al-Khattab","Uthman ibn Affan"],
    fact:"The Prophet ﷺ built it with his own blessed hands, carrying stones together with his companions.",
    src:"Books of Seerah" },
  { q:"What is the name of the graveyard in Madinah where Muslims are buried?",
    a:"Al-Baqi' (Jannat al-Baqi')", w:["Al-Ma'la","Wadi al-Aqiq","Al-Qiblatayn"],
    fact:"Many companions and members of the Prophet's family ﷺ are buried in Al-Baqi', right next to Masjid an-Nabawi. Al-Ma'la is the graveyard of Makkah.",
    src:"Sahih Muslim (the Prophet ﷺ visiting Al-Baqi')" },
  { q:"What is the Prophet Muhammad's ﷺ full name?",
    a:"Muhammad ibn Abdullah ibn Abdul-Muttalib", w:["Muhammad ibn Abu Talib ibn Hashim","Muhammad ibn Abdul-Muttalib ibn Abdullah","Muhammad ibn Hamzah ibn Hashim"],
    fact:"\"Ibn\" means \"son of\". He ﷺ is Muhammad, son of Abdullah, son of Abdul-Muttalib, son of Hashim, from the tribe of Quraysh.",
    src:"Sahih al-Bukhari (chapter on the lineage of the Prophet ﷺ)" },
  { q:"What was the name of the Prophet Muhammad's ﷺ mother?",

/* ===================== Girls ===================== */
const GIRLS = [
  { name:"Yusra", dress:"#8fb07a", trim:"#6f9460", dots:"#eaf3dc", hijab:"#d7e6c4", line:"#a9c290" },
  { name:"Huda",  dress:"#3f7d5c", trim:"#2c5c42", dots:"#cfe8d6", hijab:"#9cc9a8", line:"#6ea681" },
];
function girlHTML(i, extra=""){
  const g = GIRLS[i];
  return `<div class="girl ${extra}" data-girl="${i}">
    <svg viewBox="0 0 120 200" role="img" aria-label="${g.name}" style="--dress:${g.dress};--trim:${g.trim};--dots:${g.dots};--hijab:${g.hijab};--hijab-line:${g.line}">
      <use href="#girl"/></svg>
    <div class="tag">${g.name}<b class="score" hidden>0</b></div></div>`;
}
// <use> can't reach the arm groups for the cheer animation, so inline the symbol instead.
const SYMBOL = document.getElementById("girl").innerHTML;
function drawGirls(el, opts={}){
  el.innerHTML = girlHTML(0) + girlHTML(1);
  el.querySelectorAll("svg").forEach(s => s.innerHTML = SYMBOL);
  if (opts.scores) el.querySelectorAll(".score").forEach(b => b.hidden = false);
}

/* ===================== State ===================== */
const $ = id => document.getElementById(id);
let mode = "vs", len = 10, deck = [], idx = 0, turn = 0, scores = [0,0], teamScore = 0, missed = [], answered = false;

function pick(groupId, attr, set){
  $(groupId).addEventListener("click", e => {
    const b = e.target.closest("[data-"+attr+"]"); if (!b) return;
    $(groupId).querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", p === b));
    set(b.dataset[attr]);
  });
}
pick("modeChoices","mode", v => mode = v);
pick("lenChoices","len", v => len = +v);

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); }

function startGame(){
  deck = shuffle(QUESTIONS).slice(0, len);
  idx = 0; turn = Math.random() < .5 ? 0 : 1; scores = [0,0]; teamScore = 0; missed = [];
  drawGirls($("playGirls"), { scores:true });
  show("play"); renderQ();
}

function renderQ(){
  answered = false;
  const item = deck[idx];
  $("count").textContent = `${idx+1} / ${deck.length}`;
  $("progFill").style.width = (idx / deck.length * 100) + "%";
  $("q").textContent = item.q;
  $("fact").classList.remove("on"); $("nextRow").classList.remove("on");
  const girls = $("playGirls").querySelectorAll(".girl");
  girls.forEach((g,i) => { g.classList.remove("cheer","sad");
    g.classList.toggle("turn", mode === "team" || i === turn);
    g.classList.toggle("dim", mode === "vs" && i !== turn); });
  $("who").innerHTML = mode === "vs" ? `It's <b>${GIRLS[turn].name}</b>'s turn!` : `<b>Yusra &amp; Huda</b>, answer together!`;
  const opts = shuffle([item.a, ...item.w]);
  $("answers").innerHTML = opts.map((o,i) =>
    `<button class="ans" data-ok="${o === item.a}"><span class="let">${"ABCD"[i]}</span><span>${o}</span></button>`).join("");
  updateScores();
}

function updateScores(){
  $("playGirls").querySelectorAll(".score").forEach((b,i) => b.textContent = mode === "vs" ? scores[i] : teamScore);
}

$("answers").addEventListener("click", e => {
  const b = e.target.closest(".ans"); if (!b || answered) return;
  answered = true;
  const ok = b.dataset.ok === "true", item = deck[idx];
  $("answers").querySelectorAll(".ans").forEach(x => {
    x.disabled = true;
    if (x.dataset.ok === "true") x.classList.add("right");
    else if (x !== b) x.classList.add("fade");
  });
  if (!ok) b.classList.add("wrong");
  const actors = mode === "vs" ? [turn] : [0,1];
  const girls = $("playGirls").querySelectorAll(".girl");
  actors.forEach(i => girls[i].classList.add(ok ? "cheer" : "sad"));
  if (ok) { mode === "vs" ? scores[turn]++ : teamScore++; burst(18); }
  else missed.push(item);
  updateScores();
  const name = mode === "vs" ? GIRLS[turn].name : "Yusra & Huda";
  $("res").className = "res " + (ok ? "good" : "bad");
  $("res").textContent = ok ? `MashaAllah, ${name}! ⭐` : `Good try! The answer is: ${item.a}`;
  $("factText").textContent = item.fact;
  $("src").textContent = "Source: " + item.src;
  $("fact").classList.add("on"); $("nextRow").classList.add("on");
  $("next").textContent = idx + 1 < deck.length ? "Next ➜" : "See results 🏁";
  $("next").focus({ preventScroll:true });
  $("nextRow").scrollIntoView({ behavior:"smooth", block:"nearest" });
});

$("next").addEventListener("click", () => {
  speechSynthesis && speechSynthesis.cancel();
  idx++;
  if (mode === "vs") turn = 1 - turn;
  if (idx < deck.length) renderQ(); else finish();
});

function finish(){
  $("progFill").style.width = "100%";
  drawGirls($("endGirls"), { scores:true });
  const girls = $("endGirls").querySelectorAll(".girl");
  let title, text, pct;
  if (mode === "vs"){
    girls.forEach((g,i) => g.querySelector(".score").textContent = scores[i]);
    const [y,h] = scores;
    if (y === h){ title = "It's a tie! 🤝"; text = `You both got ${y} stars. MashaAllah, you're both winners!`; girls.forEach(g => g.classList.add("cheer")); }
    else { const w = y > h ? 0 : 1; title = `${GIRLS[w].name} wins! 🏆`; text = `Yusra: ${y} ⭐ · Huda: ${h} ⭐ — well done, both of you!`;
      girls[w].classList.add("cheer"); }
    pct = (y + h) / deck.length;
  } else {
    girls.forEach(g => { g.querySelector(".score").textContent = teamScore; g.classList.add("cheer"); });
    title = teamScore === deck.length ? "Perfect score! 🏆" : "MashaAllah, team! 🤝";
    text = `You got ${teamScore} out of ${deck.length} right together.`;
    pct = teamScore / deck.length;
  }
  const stars = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  $("endStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  $("endTitle").textContent = title; $("endText").textContent = text;
  $("reviewCard").hidden = !missed.length;
  $("review").innerHTML = missed.map(m => `<li>${m.q}<br><b>${m.a}</b></li>`).join("");
  show("end"); burst(80);
}

/* ===================== Read aloud ===================== */
$("speak").addEventListener("click", () => {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const item = deck[idx];
  const opts = [...$("answers").querySelectorAll(".ans span:last-child")].map((s,i) => `${"ABCD"[i]}: ${s.textContent}`);
  const text = (answered ? $("res").textContent + ". " + item.fact : item.q + " " + opts.join(". "))
    .replace(/ﷺ/g, ", peace be upon him,");
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .92;
  speechSynthesis.speak(u);
});

/* ===================== Confetti ===================== */
function burst(n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("confetti"), colors = ["#3f7d5c","#8fb07a","#e1a93b","#d7e6c4","#c9aa72"];
  for (let i=0;i<n;i++){
    const c = document.createElement("i");
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.6 + Math.random()*1.6 + "s";
    c.style.animationDelay = Math.random()*.4 + "s";
    box.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}

/* ===================== Navigation ===================== */
$("go").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("toStart").addEventListener("click", () => show("start"));
$("home").addEventListener("click", () => { speechSynthesis && speechSynthesis.cancel(); show("start"); });
drawGirls($("startGirls"));
</script>
</body>
